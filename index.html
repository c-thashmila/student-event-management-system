<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-calendar-check"></i> Student Event Management</h1>
            <p>Organize, track, and manage university events efficiently.</p>
        </header>

        <!-- Form Section -->
        <section class="card">
            <h2><i class="fa-solid fa-plus-circle"></i> Add New Event</h2>
            <form id="eventForm">
                <div class="form-group">
                    <input type="text" id="eventName" placeholder="Event Name (e.g., Tech Symposium)" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <select id="eventCategory" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Academic">Academic</option>
                            <option value="Sports">Sports</option>
                            <option value="Cultural">Cultural</option>
                            <option value="Workshop">Workshop</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <input type="text" id="eventLocation" placeholder="Location (e.g., Main Auditorium)" required>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Add Event</button>
            </form>
        </section>

        <!-- Search & Filter Section -->
        <section class="controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search events...">
            </div>
            <div class="filter-box">
                <select id="filterCategory">
                    <option value="All">All Categories</option>
                    <option value="Academic">Academic</option>
                    <option value="Sports">Sports</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Workshop">Workshop</option>
                </select>
            </div>
        </section>

        <!-- Event List Section -->
        <section class="card">
            <h2><i class="fa-solid fa-list-check"></i> Upcoming Events</h2>
            <ul id="eventList" class="event-list"></ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
